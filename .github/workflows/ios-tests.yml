name: iOS Tests

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  ios-change-detection:
    name: iOS Change Detection
    runs-on: ubuntu-latest
    outputs:
      should-run-ios: ${{ steps.changed-files.outputs.should-run-ios }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect iOS-relevant changes
        id: changed-files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          cat changed-files.txt

          if grep -E '^Scout/(Gemfile|Gemfile\.lock|Makefile|Scout/|Scout\.xcodeproj/|ScoutDesign/|ScoutTests/|ScoutUITests/|fastlane/)' changed-files.txt; then
            echo "should-run-ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run-ios=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Swift Tests
    needs: ios-change-detection
    if: needs.ios-change-detection.outputs.should-run-ios == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: Scout

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Bundler
        run: gem install bundler

      - name: Configure Bundler cache path
        run: bundle config set path vendor/bundle

      - name: Cache Bundler dependencies
        uses: actions/cache@v4
        with:
          path: Scout/vendor/bundle
          key: ${{ runner.os }}-bundler-${{ hashFiles('Scout/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundler-

      - name: Install gems
        run: bundle install

      - name: Run tests
        env:
          SUPABASE_SCHEME: https
          SUPABASE_HOST: example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
        run: bundle exec fastlane ios tests
