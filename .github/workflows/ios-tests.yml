name: iOS Tests

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: Scout

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Bundler
        run: gem install bundler

      - name: Install gems
        run: bundle install

      - name: Run tests
        env:
          SUPABASE_SCHEME: https
          SUPABASE_HOST: example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
        run: bundle exec fastlane ios tests
