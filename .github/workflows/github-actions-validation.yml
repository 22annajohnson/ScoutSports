name: GitHub Actions Validation

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  github-actions-validation:
    name: GitHub Actions Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect GitHub Actions validation changes
        id: changed-files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git ls-tree -r --name-only "$HEAD_SHA" > changed-files.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          fi

          cat changed-files.txt

          if grep -E '(\.ya?ml$|^\.github/scripts/validate-yaml\.rb$|^\.github/workflows/github-actions-validation\.yml$)' changed-files.txt; then
            echo "should-validate=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-validate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate YAML
        if: steps.changed-files.outputs.should-validate == 'true'
        run: ruby .github/scripts/validate-yaml.rb .github/yaml-validation.yml
