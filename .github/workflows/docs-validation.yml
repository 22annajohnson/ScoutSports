name: Docs Validation

on:
  pull_request:
    branches: [ develop ]
    paths:
      - "**/*.md"
      - ".github/markdown-validation.yml"
      - ".github/scripts/validate-markdown.rb"
      - ".github/workflows/docs-validation.yml"
  push:
    branches: [ develop ]
    paths:
      - "**/*.md"
      - ".github/markdown-validation.yml"
      - ".github/scripts/validate-markdown.rb"
      - ".github/workflows/docs-validation.yml"

jobs:
  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Markdown
        run: ruby .github/scripts/validate-markdown.rb .github/markdown-validation.yml
