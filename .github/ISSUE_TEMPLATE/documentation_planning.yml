name: Documentation or planning request
description: Request documentation, planning, or implementation-plan updates.
title: "Docs/Planning: "
labels:
  - documentation
  - planning
body:
  - type: markdown
    attributes:
      value: |
        Use this form for documentation and planning intake. Jira remains Scout's authoritative tracker for approved execution work.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What document, plan, or planning decision needs attention?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Repository area
      options:
        - iOS
        - web
        - Supabase
        - docs
        - CI/CD
        - Cross-cutting
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link related docs, Jira issues, PRs, decisions, or product notes.
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: What should be true when this is complete?
    validations:
      required: true
  - type: input
    id: jira
    attributes:
      label: Jira ticket
      description: Link the Jira issue if one already exists.
      placeholder: INFRA-123 or https://thescoutapp.atlassian.net/browse/...
